name: Setup Xantham
description: Install the repository's Node and .NET toolchain
inputs:
  npm-cache:
    description: Cache npm downloads for builds that install JavaScript dependencies
    default: 'true'
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: .node-version
        package-manager-cache: false
        cache: ${{ inputs.npm-cache == 'true' && 'npm' || '' }}
        cache-dependency-path: |
          package-lock.json
          tests/Xantham.Generator.PartasGate/package-lock.json
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json
