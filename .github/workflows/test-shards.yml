name: Test shards
on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  XANTHAM_REQUIRE_TSC: 1

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run exhaustive test shard
        run: dotnet fsi build.fsx -- test --ci --shard "${{ matrix.shard }}/8" --run-gate ${{ matrix.shard == 1 && 'true' || 'false' }}
