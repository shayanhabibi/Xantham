name: PR title
on:
  pull_request_target:
    branches: [develop, master]
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      # Read event metadata only: no checkout or execution of PR code.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const release = pr.base.ref === 'master' && pr.head.ref === 'develop' &&
              pr.head.repo.full_name === context.repo.owner + '/' + context.repo.repo;
            if (!release && !/^(feat|fix|perf|refactor|revert|build|ci|docs|style|test|chore)(\([^)\r\n]+\))?!?: \S[^\r\n]*$/.test(pr.title)) {
              core.setFailed('Use a conventional PR title, e.g. feat(generator): support a new mapping or fix(wire): correct decoding.');
            }
