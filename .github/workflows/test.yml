name: Test
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  XANTHAM_REQUIRE_TSC: 1

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Detect source and build input changes
        id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const verificationScope = require('./.github/scripts/verification-scope.cjs');
            await verificationScope({ github, context, core });
      - name: Check CI policy and golden tooling
        run: node --test .github/scripts/*.test.cjs tools/golden-provenance.test.mjs tools/golden-tag.test.mjs
      - name: Reuse exact-commit develop tests for release PRs
        if: steps.scope.outputs.full == 'true'
        id: develop-tests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const reuseDevelopTests = require('./.github/scripts/reuse-develop-tests.cjs');
            await reuseDevelopTests({ github, context, core });
      - uses: ./.github/actions/setup
        if: steps.scope.outputs.full == 'true' && steps.develop-tests.outputs.reused != 'true'
      - name: Check build command behavior
        if: steps.scope.outputs.full == 'true' && steps.develop-tests.outputs.reused != 'true'
        run: node tools/verify-build.mjs
      - name: Test
        if: steps.scope.outputs.full == 'true' && steps.develop-tests.outputs.reused != 'true'
        run: dotnet fsi build.fsx -- test --ci --run-gate
      - name: Record golden provenance
        if: steps.scope.outputs.full == 'true' && steps.develop-tests.outputs.reused != 'true'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: node tools/golden-provenance.mjs --commit "$SOURCE_COMMIT"
      - name: Upload verified goldens
        if: steps.scope.outputs.full == 'true' && steps.develop-tests.outputs.reused != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: goldens-${{ github.sha }}
          path: tests/.scratch/golden-artifact
          if-no-files-found: error
          retention-days: 90
