name: Test
on:
  pull_request:
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  XANTHAM_REQUIRE_TSC: 1

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    outputs:
      full: ${{ steps.scope.outputs.full }}
      reused: ${{ steps.develop-tests.outputs.reused || 'false' }}
      master-reused: ${{ steps.develop-tests.outputs.master-reused || 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Detect source and build input changes
        id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const verificationScope = require('./.github/scripts/verification-scope.cjs');
            await verificationScope({ github, context, core });
      - name: Check CI policy and golden tooling
        run: node --test .github/scripts/*.test.cjs tools/golden-provenance.test.mjs tools/golden-tag.test.mjs
      - name: Reuse verified develop tests for release PRs and identical master trees
        if: steps.scope.outputs.full == 'true'
        id: develop-tests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const reuseDevelopTests = require('./.github/scripts/reuse-develop-tests.cjs');
            await reuseDevelopTests({ github, context, core });
      - uses: ./.github/actions/setup
        if: steps.scope.outputs.full == 'true' && steps.develop-tests.outputs.reused != 'true'
      - name: Check build command behavior
        if: steps.scope.outputs.full == 'true' && steps.develop-tests.outputs.reused != 'true'
        run: node tools/verify-build.mjs

  shards:
    needs: scope
    if: needs.scope.outputs.full == 'true' && needs.scope.outputs.reused != 'true'
    uses: ./.github/workflows/test-shards.yml

  test:
    needs: [scope, shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      FULL: ${{ needs.scope.outputs.full }}
      REUSED: ${{ needs.scope.outputs.reused }}
      SHARDS_RESULT: ${{ needs.shards.result }}
      MASTER_REUSED: ${{ needs.scope.outputs.master-reused }}
      EVENT_NAME: ${{ github.event_name }}
      BRANCH_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require successful verification
        run: node .github/scripts/test-matrix-status.cjs
      # Full evidence is fresh shards or a master tree identical to a fully tested develop parent.
      # Reused release PR checks never create this marker or golden artifacts.
      - name: Test
        if: needs.scope.outputs.full == 'true' && (needs.scope.outputs.reused != 'true' || needs.scope.outputs.master-reused == 'true')
        run: node .github/scripts/test-matrix-status.cjs --require-full
      - name: Record golden provenance
        if: needs.scope.outputs.full == 'true' && (needs.scope.outputs.reused != 'true' || needs.scope.outputs.master-reused == 'true')
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: node tools/golden-provenance.mjs --commit "$SOURCE_COMMIT"
      - name: Upload verified goldens
        if: needs.scope.outputs.full == 'true' && (needs.scope.outputs.reused != 'true' || needs.scope.outputs.master-reused == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: goldens-${{ github.sha }}
          path: tests/.scratch/golden-artifact
          if-no-files-found: error
          retention-days: 90
