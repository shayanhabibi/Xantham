name: Prepare release
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Open develop-to-master PR number
        required: true
        type: string
      preview:
        description: Preview without pushing or dispatching checks
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-develop
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/release'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      requested: ${{ steps.request.outputs.requested }}
      head: ${{ steps.request.outputs.head }}
      base: ${{ steps.request.outputs.base }}
    steps:
      # Execute the wrapper from protected master, not from a PR's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          path: trusted
          persist-credentials: false
      - name: Authorize release request
        id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./trusted/.github/scripts/release-bot.cjs').prepare({ github, context, core });
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.request.outputs.requested == 'true'
        with:
          ref: ${{ steps.request.outputs.head }}
          path: release
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: steps.request.outputs.requested == 'true'
        with:
          global-json-file: release/global.json
      - name: Generate versions and changelogs with ShipIt
        if: steps.request.outputs.requested == 'true'
        working-directory: release
        run: |
          git switch -C develop
          SHIPIT_VERSION=$(node -p "require('../trusted/.config/dotnet-tools.json').tools['easybuild.shipit'].version")
          dotnet tool install EasyBuild.ShipIt --version "$SHIPIT_VERSION" --tool-path "$RUNNER_TEMP/shipit"
          "$RUNNER_TEMP/shipit/shipit" --mode local --allow-branch develop --skip-merge-commit
          git diff > ../release.patch
      - name: Upload release diff
        if: steps.request.outputs.requested == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-diff-${{ github.run_id }}
          path: release.patch
          if-no-files-found: error

  finalize:
    needs: generate
    if: needs.generate.outputs.requested == 'true'
    environment: release-preparation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      # Only master can access this environment's deploy key. No approval is needed.
      # A fresh runner: no tools, hooks or scripts from develop execute here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.generate.outputs.head }}
          path: release
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-diff-${{ github.run_id }}
          path: patch
      - name: Validate, push and start required checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_HEAD: ${{ needs.generate.outputs.head }}
          RELEASE_BASE: ${{ needs.generate.outputs.base }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        with:
          script: |
            const bot = require('./trusted/.github/scripts/release-bot.cjs');
            const request = bot.releaseRequest(context);
            if (!request) throw new Error('Missing authorized release request.');
            const root = require('node:path').resolve('release');
            const patch = require('node:fs').readFileSync('patch/release.patch');
            if (patch.length) require('node:child_process').execFileSync('git', ['apply', '--whitespace=error', '-'], { cwd: root, input: patch });
            await bot.finish({ github, context, core, root, sshKey: process.env.RELEASE_DEPLOY_KEY,
              request: { ...request, head: process.env.RELEASE_HEAD, base: process.env.RELEASE_BASE } });
