name: Publish
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'build.fsx'
      - 'Xantham.slnx'
      - 'Directory.Build.*'
      - 'global.json'
      - 'dotnet-tools.json'
      - 'package*.json'
      - '.node-version'
      - '.github/actions/**'
      - '.github/workflows/push_master.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  XANTHAM_REQUIRE_TSC: 1

# Complete each package upload before starting another release.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check build command behavior
        run: node tools/verify-build.mjs
      - name: Verify and pack
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            dotnet fsi build.fsx -- pack --ci --skip-tests
          else
            dotnet fsi build.fsx -- pack --ci --run-gate
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-${{ github.sha }}
          path: bin/*.nupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-cache: 'false'
      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packages-${{ github.sha }}
          path: bin
      - name: Publish verified packages
        env:
          NUGET_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: dotnet fsi build.fsx -- publish artifacts --nuget-source https://nuget.cloudsmith.io/shayanhabibi/xantham/v3/index.json
