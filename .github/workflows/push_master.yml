name: Publish
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'build.fsx'
      - 'Xantham.slnx'
      - 'Directory.Build.*'
      - 'global.json'
      - '.config/dotnet-tools.json'
      - 'package*.json'
      - '.node-version'
      - '.github/actions/**'
      - '.github/workflows/push_master.yml'
      - '.github/workflows/test-shards.yml'
  workflow_dispatch:
    inputs:
      support_only:
        description: Publish the validated Core and Core.TS support packages only
        type: boolean
        default: false
      support_package:
        description: Support package selection
        type: choice
        options: [all, core-ts]
        default: all
      validated_sha:
        description: Commit whose support sources and tests were validated
        type: string
        required: false

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  XANTHAM_REQUIRE_TSC: 1

# Complete each package upload before starting another release.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish-support-only:
    if: github.event_name == 'workflow_dispatch' && inputs.support_only && github.ref == 'refs/heads/fidelity/pi-constraints'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind the support source to the validated commit
        env:
          VALIDATED_SHA: ${{ inputs.validated_sha }}
        run: |
          [[ "$VALIDATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$VALIDATED_SHA" "$GITHUB_SHA"
          git diff --quiet "$VALIDATED_SHA" "$GITHUB_SHA" -- . ':(exclude).github/workflows/push_master.yml'
      - uses: ./.github/actions/setup
      - name: Refuse existing immutable support versions
        env:
          SUPPORT_PACKAGE: ${{ inputs.support_package }}
        run: |
          python3 - <<'PY'
          import io, json, os, pathlib, urllib.request, xml.etree.ElementTree as ET, zipfile
          selection = os.environ['SUPPORT_PACKAGE']
          if selection not in ('all', 'core-ts'):
              raise SystemExit('invalid support package selection')
          names = ['Xantham.Fable.Core.TS'] if selection == 'core-ts' else ['Xantham.Fable.Core', 'Xantham.Fable.Core.TS']
          if selection == 'core-ts':
              core = 'Xantham.Fable.Core'
              version = ET.parse(f'src/{core}/{core}.fsproj').find('.//Version').text
              url = f'https://dl.cloudsmith.io/public/shayanhabibi/xantham/nuget/{core.lower()}/{version.lower()}/{core.lower()}.{version.lower()}.nupkg'
              with urllib.request.urlopen(url, timeout=30) as response:
                  archive = zipfile.ZipFile(io.BytesIO(response.read()))
              for file in ('Library.fs', 'Helpers.fs', core + '.fsproj'):
                  if archive.read('fable/' + file) != pathlib.Path('src', core, file).read_bytes():
                      raise SystemExit(f'published {core} {version} differs from validated source: {file}')
          for name in names:
              version = ET.parse(f'src/{name}/{name}.fsproj').find('.//Version').text
              url = f'https://dl.cloudsmith.io/public/shayanhabibi/xantham/nuget/{name.lower()}/index.json'
              with urllib.request.urlopen(url, timeout=30) as response:
                  versions = json.load(response)['versions']
              if version.lower() in [v.lower() for v in versions]:
                  raise SystemExit(f'{name} {version} already exists; inspect before retrying')
          PY
      - name: Pack the validated support packages
        env:
          SUPPORT_PACKAGE: ${{ inputs.support_package }}
        run: |
          if [ "$SUPPORT_PACKAGE" = core-ts ]; then
            dotnet fsi build.fsx -- pack --ci --no-format --skip-tests --project Xantham.Fable.Core.TS
          else
            dotnet fsi build.fsx -- pack --ci --no-format --skip-tests --project Xantham.Fable.Core Xantham.Fable.Core.TS
          fi
      - name: Retain support packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pi-support-packages-${{ github.sha }}
          path: bin/*.nupkg
          if-no-files-found: error
      - name: Publish support packages to Cloudsmith
        env:
          NUGET_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          SUPPORT_PACKAGE: ${{ inputs.support_package }}
        run: |
          if [ "$SUPPORT_PACKAGE" = core-ts ]; then
            dotnet fsi build.fsx -- publish artifacts --project Xantham.Fable.Core.TS --nuget-source https://nuget.cloudsmith.io/shayanhabibi/xantham/v3/index.json
          else
            dotnet fsi build.fsx -- publish artifacts --project Xantham.Fable.Core Xantham.Fable.Core.TS --nuget-source https://nuget.cloudsmith.io/shayanhabibi/xantham/v3/index.json
          fi

  package:
    outputs:
      full: ${{ steps.scope.outputs.full }}
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect source and build input changes
        id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const verificationScope = require('./.github/scripts/verification-scope.cjs');
            await verificationScope({ github, context, core });
      - name: Check CI policy
        run: node --test .github/scripts/*.test.cjs
      - name: Verify release versions and dependent packages
        run: node .github/scripts/release-versions.cjs
        env:
          XANTHAM_RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || (github.ref == 'refs/heads/develop' && 'origin/master') || github.sha }}
      - uses: ./.github/actions/setup
        if: steps.scope.outputs.full == 'true'
      - name: Check build command behavior
        if: steps.scope.outputs.full == 'true'
        run: |
          node tools/verify-build.mjs
          node tools/verify-release.mjs
      - name: Verify and pack
        if: steps.scope.outputs.full == 'true'
        run: dotnet fsi build.fsx -- pack --ci --skip-tests
      - name: Upload packages
        if: steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ github.sha }}
          path: bin/*.nupkg
          if-no-files-found: error
          retention-days: 14

  verification:
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && needs.package.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      verified: ${{ steps.tests.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require full Test evidence for this master commit
        id: tests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const requireMasterTests = require('./.github/scripts/require-master-tests.cjs');
            await requireMasterTests({ github, context, core });

  publish:
    if: always() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && needs.package.outputs.full == 'true'
    needs: [package, verification]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require verified packages and tests
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          FULL: ${{ needs.package.outputs.full }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          VERIFIED: ${{ needs.verification.outputs.verified }}
        run: node .github/scripts/publish-matrix-status.cjs
      - uses: ./.github/actions/setup
        with:
          npm-cache: 'false'
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages-${{ github.sha }}
          path: bin
      - name: Publish verified packages
        env:
          NUGET_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: dotnet fsi build.fsx -- publish artifacts --nuget-source https://nuget.cloudsmith.io/shayanhabibi/xantham/v3/index.json
