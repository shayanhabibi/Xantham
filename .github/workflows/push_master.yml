name: CI
on:
  push:
    branches:
      - master
    paths:
      - '**.fs'
      - 'src/**/**.fsproj'
      - 'package.json'
      - '!site/Site.fs'
      - '!**/*.fsx'
      - '!build.fsx'
  workflow_dispatch: 

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # The live tests skip themselves when no `tsc` is installed, which on a runner would be a green
  # build that tested nothing. This turns that skip into a failure - see `Tsc.test.fs`.
  XANTHAM_REQUIRE_TSC: 1

# Queue rather than cancel: a cancelled run can stop between two `dotnet nuget push` calls and
# leave a release half-published.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Checkout source code
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore tools
        run: dotnet tool restore
      - name: Run CI
        # `Baked.NuGet.apiKey` reads NUGET_API_KEY when no `--nuget-key` is given. `--run-gate`
        # adds the Fable run gate ahead of packing, as the test workflow runs it.
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_KEY }}
        run: dotnet fsi build.fsx -- publish --run-gate
