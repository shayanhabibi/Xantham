name: Publish
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'build.fsx'
      - 'Xantham.slnx'
      - 'Directory.Build.*'
      - 'global.json'
      - '.config/dotnet-tools.json'
      - 'package*.json'
      - '.node-version'
      - '.github/actions/**'
      - '.github/workflows/push_master.yml'
      - '.github/workflows/test-shards.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  XANTHAM_REQUIRE_TSC: 1

# Complete each package upload before starting another release.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    outputs:
      full: ${{ steps.scope.outputs.full }}
      master-reused: ${{ steps.develop-tests.outputs.master-reused || 'false' }}
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect source and build input changes
        id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const verificationScope = require('./.github/scripts/verification-scope.cjs');
            await verificationScope({ github, context, core });
      - name: Check CI policy
        run: node --test .github/scripts/*.test.cjs
      - name: Reuse verified develop tests for identical master trees
        if: steps.scope.outputs.full == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        id: develop-tests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const reuseDevelopTests = require('./.github/scripts/reuse-develop-tests.cjs');
            await reuseDevelopTests({ github, context, core });
      - name: Verify release versions and dependent packages
        run: node .github/scripts/release-versions.cjs
        env:
          XANTHAM_RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || (github.ref == 'refs/heads/develop' && 'origin/master') || github.sha }}
      - uses: ./.github/actions/setup
        if: steps.scope.outputs.full == 'true'
      - name: Check build command behavior
        if: steps.scope.outputs.full == 'true'
        run: |
          node tools/verify-build.mjs
          node tools/verify-release.mjs
      - name: Verify and pack
        if: steps.scope.outputs.full == 'true'
        run: dotnet fsi build.fsx -- pack --ci --skip-tests
      - name: Upload packages
        if: steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-${{ github.sha }}
          path: bin/*.nupkg
          if-no-files-found: error
          retention-days: 14

  publish-tests:
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && needs.package.outputs.full == 'true' && needs.package.outputs.master-reused != 'true'
    uses: ./.github/workflows/test-shards.yml

  publish:
    if: always() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && needs.package.outputs.full == 'true'
    needs: [package, publish-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require verified packages and tests
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          FULL: ${{ needs.package.outputs.full }}
          MASTER_REUSED: ${{ needs.package.outputs.master-reused }}
          SHARDS_RESULT: ${{ needs.publish-tests.result }}
        run: node .github/scripts/publish-matrix-status.cjs
      - uses: ./.github/actions/setup
        with:
          npm-cache: 'false'
      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packages-${{ github.sha }}
          path: bin
      - name: Publish verified packages
        env:
          NUGET_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: dotnet fsi build.fsx -- publish artifacts --nuget-source https://nuget.cloudsmith.io/shayanhabibi/xantham/v3/index.json
