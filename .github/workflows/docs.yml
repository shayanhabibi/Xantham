name: Docs

# Trigger this Action when new code is pushed to the master branch
on:
  workflow_dispatch:
  push:
    branches:
      - master

# We need some permissions to publish to Github Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the source code
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Restore the local tools
      - name: Restore tools
        run: dotnet tool restore
      # Build the reference projects and generate the documentation files. `--quick` skips the
      # clean and format stages; the checkout is fresh, and formatting is the test workflow's job.
      - name: Generate the documentation
        run: dotnet fsi build.fsx -- docs --quick
      # Upload the static files
      - name: Upload documentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./output
  
  # GitHub Actions recommends deploying in a separate job.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5